<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Muse AI Gateway</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/dashboard.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: 40px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 30px rgba(99, 102, 241, 0.15);
      position: relative;
      overflow: hidden;
    }
    .login-container::before {
      content: '';
      position: absolute;
      top: -100px;
      right: -100px;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.3), transparent 70%);
      pointer-events: none;
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366F1, #06B6D4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 22px;
      box-shadow: 0 8px 25px -4px rgba(99, 102, 241, 0.5);
    }
    .login-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .login-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .error-alert {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #FB7185;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .shake {
      animation: shake 0.4s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .password-wrap {
      position: relative;
    }
    .toggle-pwd {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px;
      font-size: 12px;
    }
    .toggle-pwd:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="login-container" id="loginCard">
    <div class="login-header">
      <div class="login-logo">M</div>
      <h1 class="login-title">Admin Dashboard</h1>
      <p class="login-desc">Sign in with your master gateway credentials to manage upstream pools, API keys & jobs</p>
    </div>

    <div class="error-alert" id="errorAlert"></div>

    <form id="loginForm">
      <div class="form-group" style="margin-bottom: 20px;">
        <label class="form-label" for="adminKeyInput">Master Admin Key</label>
        <div class="password-wrap">
          <input 
            type="password" 
            id="adminKeyInput" 
            class="form-input font-mono" 
            placeholder="adm_live_..." 
            autocomplete="current-password" 
            required
            autofocus
          >
          <button type="button" class="toggle-pwd" id="togglePwdBtn">Show</button>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px;">
        <label class="form-checkbox-label">
          <input type="checkbox" id="rememberMe" class="form-checkbox" checked>
          <span>Keep session for 7 days</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%; padding: 12px; font-size: 14px;">
        Sign In to Gateway
      </button>
    </form>

    <div style="margin-top: 24px; text-align: center;">
      <a href="/docs" style="font-size: 12px; color: var(--text-dim); text-decoration: none;">View OpenAPI Documentation &rarr;</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const input = document.getElementById('adminKeyInput');
    const rememberMe = document.getElementById('rememberMe');
    const errorAlert = document.getElementById('errorAlert');
    const loginCard = document.getElementById('loginCard');
    const submitBtn = document.getElementById('submitBtn');
    const togglePwdBtn = document.getElementById('togglePwdBtn');

    togglePwdBtn.addEventListener('click', () => {
      if (input.type === 'password') {
        input.type = 'text';
        togglePwdBtn.textContent = 'Hide';
      } else {
        input.type = 'password';
        togglePwdBtn.textContent = 'Show';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying...';

      try {
        const res = await fetch('/admin/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            admin_key: input.value.trim(),
            remember: rememberMe.checked
          })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error?.message || 'Authentication failed');
        }

        submitBtn.textContent = 'Redirecting...';
        const params = new URLSearchParams(window.location.search);
        const rawReturnTo = params.get('return_to') || '/admin';
        const returnTo = (rawReturnTo.startsWith('/') && !rawReturnTo.startsWith('//') && !rawReturnTo.startsWith('/\\'))
          ? rawReturnTo
          : '/admin';
        window.location.href = returnTo;

      } catch (err) {
        errorAlert.textContent = err.message;
        errorAlert.style.display = 'block';
        loginCard.classList.remove('shake');
        void loginCard.offsetWidth; // Trigger reflow
        loginCard.classList.add('shake');
        input.focus();
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In to Gateway';
      }
    });
  </script>
</body>
</html>
