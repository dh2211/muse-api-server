# nginx reverse proxy for the Muse AI Gateway API.
# Place in /etc/nginx/sites-available/ and symlink into sites-enabled/.
# Obtain TLS certificates with: certbot --nginx -d api.example.com

upstream muse_api {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Reference media can be uploaded inline (base64) or via multipart.
    client_max_body_size 120m;

    # Long-running synchronous generation and streaming chat.
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location / {
        proxy_pass http://muse_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # Required for Server-Sent Events (chat streaming).
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
